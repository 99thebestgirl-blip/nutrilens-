<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriLens</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f6f8f7;
  color: #222;
}

header {
  background: #4caf50;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.section {
  background: white;
  padding: 18px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
}

input,
button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  background: #4caf50;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

.image-button {
  display: block;
  text-align: center;
  background: #eef7ee;
  color: #388e3c;
  padding: 14px;
  border-radius: 14px;
  cursor: pointer;
  margin-top: 10px;
}

#imageInput {
  display: none;
}

.preview {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 18px;
  margin-top: 15px;
  display: none;
}

.food-card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.food-card img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
}

.food-info {
  padding: 16px;
}

.food-info h3 {
  margin: 0 0 10px;
}

.nutrition {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.nutrition div {
  background: #f3f7f3;
  padding: 10px;
  border-radius: 10px;
}

.delete-btn {
  background: #e53935;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

.total {
  font-size: 20px;
  font-weight: bold;
  color: #388e3c;
}
</style>
</head>

<body>

<header>
  <h1>🥗 NutriLens</h1>
  <p>تتبّع وجباتك بسهولة</p>
</header>

<div class="container">

  <!-- إضافة وجبة -->
  <div class="section">
    <h2>🍽️ إضافة وجبة</h2>

    <input
      type="text"
      id="foodName"
      placeholder="اسم الوجبة"
    >

    <input
      type="number"
      id="calories"
      placeholder="السعرات الحرارية"
    >

    <input
      type="number"
      id="protein"
      placeholder="البروتين (غ)"
    >

    <input
      type="number"
      id="carbs"
      placeholder="الكاربوهيدرات (غ)"
    >

    <input
      type="number"
      id="fat"
      placeholder="الدهون (غ)"
    >

    <!-- اختيار صورة -->
    <label class="image-button" for="imageInput">
      🖼️ اختر صورة الأكل من الألبوم
    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img
      id="preview"
      class="preview"
      alt="معاينة صورة الوجبة"
    >

    <button onclick="addFood()">
      ➕ إضافة الوجبة
    </button>
  </div>


  <!-- مجموع اليوم -->
  <div class="section">
    <h2>📊 مجموع اليوم</h2>

    <div class="total">
      السعرات: <span id="totalCalories">0</span> سعرة
    </div>

    <div>
      البروتين: <span id="totalProtein">0</span> غ
    </div>

    <div>
      الكارب: <span id="totalCarbs">0</span> غ
    </div>

    <div>
      الدهون: <span id="totalFat">0</span> غ
    </div>
  </div>


  <!-- الوجبات -->
  <div class="section">
    <h2>🍴 أكل اليوم</h2>

    <div id="foodList"></div>
  </div>

</div>


<script>

let selectedImage = "";


/* =========================
   اختيار صورة من الألبوم
========================= */

document
  .getElementById("imageInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      resizeImage(
        e.target.result,
        function(image) {

          selectedImage = image;

          const preview =
            document.getElementById("preview");

          preview.src = image;
          preview.style.display = "block";
        }
      );
    };

    reader.readAsDataURL(file);
  });


/* =========================
   تصغير الصورة
========================= */

function resizeImage(imageData, callback) {

  const img = new Image();

  img.onload = function() {

    const maxSize = 800;

    let width = img.width;
    let height = img.height;

    if (width > height && width > maxSize) {

      height =
        Math.round(height * maxSize / width);

      width = maxSize;

    } else if (height > maxSize) {

      width =
        Math.round(width * maxSize / height);

      height = maxSize;
    }

    const canvas =
      document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );

    const compressedImage =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );

    callback(compressedImage);
  };

  img.src = imageData;
}


/* =========================
   إضافة وجبة
========================= */

function addFood() {

  const name =
    document.getElementById("foodName").value.trim();

  const calories =
    Number(document.getElementById("calories").value) || 0;

  const protein =
    Number(document.getElementById("protein").value) || 0;

  const carbs =
    Number(document.getElementById("carbs").value) || 0;

  const fat =
    Number(document.getElementById("fat").value) || 0;


  if (!name) {

    alert("اكتبي اسم الوجبة أولاً");
    return;
  }


  const food = {

    id: Date.now(),

    name: name,

    calories: calories,

    protein: protein,

    carbs: carbs,

    fat: fat,

    image: selectedImage
  };


  let foods =
    JSON.parse(
      localStorage.getItem("nutrilensFoods") || "[]"
    );


  foods.push(food);


  localStorage.setItem(
    "nutrilensFoods",
    JSON.stringify(foods)
  );


  /* تنظيف الحقول */

  document.getElementById("foodName").value = "";
  document.getElementById("calories").value = "";
  document.getElementById("protein").value = "";
  document.getElementById("carbs").value = "";
  document.getElementById("fat").value = "";

  document.getElementById("imageInput").value = "";

  document.getElementById("preview").style.display = "none";

  document.getElementById("preview").src = "";

  selectedImage = "";


  renderFoods();
}


/* =========================
   عرض الوجبات
========================= */

function renderFoods() {

  const container =
    document.getElementById("foodList");

  const foods =
    JSON.parse(
      localStorage.getItem("nutrilensFoods") || "[]"
    );


  container.innerHTML = "";


  if (foods.length === 0) {

    container.innerHTML =
      '<div class="empty">ماكو وجبات مضافة اليوم 🍽️</div>';

    updateTotals(foods);

    return;
  }


  foods.forEach(function(food) {

    const card =
      document.createElement("div");

    card.className = "food-card";


    let imageHTML = "";

    if (food.image) {

      imageHTML = `
        <img
          src="${food.image}"
          alt="صورة ${escapeHTML(food.name)}"
        >
      `;
    }


    card.innerHTML = `

      ${imageHTML}

      <div class="food-info">

        <h3>
          ${escapeHTML(food.name)}
        </h3>

        <div class="nutrition">

          <div>
            🔥 ${food.calories} سعرة
          </div>

          <div>
            🥩 ${food.protein}غ بروتين
          </div>

          <div>
            🍞 ${food.carbs}غ كارب
          </div>

          <div>
            🥑 ${food.fat}غ دهون
          </div>

        </div>

        <button
          class="delete-btn"
          onclick="deleteFood(${food.id})"
        >
          🗑️ حذف الوجبة
        </button>

      </div>
    `;


    container.appendChild(card);
  });


  updateTotals(foods);
}


/* =========================
   حساب المجموع
========================= */

function updateTotals(foods) {

  let calories = 0;
  let protein = 0;
  let carbs = 0;
  let fat = 0;


  foods.forEach(function(food) {

    calories += Number(food.calories) || 0;

    protein += Number(food.protein) || 0;

    carbs += Number(food.carbs) || 0;

    fat += Number(food.fat) || 0;
  });


  document.getElementById("totalCalories").textContent =
    calories;

  document.getElementById("totalProtein").textContent =
    protein;

  document.getElementById("totalCarbs").textContent =
    carbs;

  document.getElementById("totalFat").textContent =
    fat;
}


/* =========================
   حذف وجبة
========================= */

function deleteFood(id) {

  let foods =
    JSON.parse(
      localStorage.getItem("nutrilensFoods") || "[]"
    );


  foods =
    foods.filter(function(food) {

      return food.id !== id;

    });


  localStorage.setItem(
    "nutrilensFoods",
    JSON.stringify(foods)
  );


  renderFoods();
}


/* =========================
   حماية النص
========================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   تشغيل التطبيق
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderFoods();

  }
);

</script>

</body>
</html>
