<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calorie ✦</title>

<style>
:root{
  --main:#8b5cf6;
  --main2:#c084fc;
  --soft:#f3eaff;
  --bg:#faf9ff;
  --card:#ffffff;
  --text:#24212b;
  --muted:#77717f;
  --border:#eee9f5;
  --danger:#ef4444;
}

*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.dark{
  --bg:#17151c;
  --card:#24212b;
  --text:#ffffff;
  --muted:#aaa3b4;
  --border:#393442;
  --soft:#332b40;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.header{
  padding:22px 20px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:var(--main);
}

.header-buttons{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:43px;
  height:43px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* MAIN */

.container{
  max-width:650px;
  margin:auto;
  padding:10px 18px 35px;
}

/* WELCOME */

.welcome{
  margin-top:10px;
  margin-bottom:18px;
}

.welcome h1{
  margin:0;
  font-size:28px;
}

.welcome p{
  margin:6px 0 0;
  color:var(--muted);
}

/* CALORIE CARD */

.calorie-card{
  background:linear-gradient(135deg,var(--main),var(--main2));
  color:white;
  padding:24px;
  border-radius:27px;
  position:relative;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(120,80,200,.22);
}

.calorie-card:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:#ffffff18;
  left:-50px;
  bottom:-70px;
}

.calorie-title{
  font-size:15px;
  opacity:.9;
}

.calorie-number{
  font-size:42px;
  font-weight:800;
  margin:5px 0;
}

.calorie-sub{
  font-size:14px;
  opacity:.85;
}

/* QUICK ACTIONS */

.section-title{
  margin:25px 0 12px;
  font-size:19px;
  font-weight:800;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.action{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:19px 12px;
  text-align:center;
  transition:.2s;
}

.action:active{
  transform:scale(.97);
}

.action-icon{
  font-size:30px;
  margin-bottom:7px;
}

.action-title{
  font-weight:700;
}

.action-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* FOOD LIST */

.food-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.food-name{
  font-weight:700;
}

.food-info{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.delete{
  border:0;
  background:#fff0f0;
  color:var(--danger);
  width:38px;
  height:38px;
  border-radius:12px;
}

/* ADD FOOD */

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  margin-top:12px;
}

label{
  display:block;
  margin-top:12px;
  font-size:14px;
  font-weight:700;
}

select,
input{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:14px;
  outline:none;
}

.main-button{
  width:100%;
  border:0;
  background:var(--main);
  color:white;
  padding:14px;
  border-radius:15px;
  margin-top:15px;
  font-weight:800;
  box-shadow:0 7px 18px rgba(100,70,180,.2);
}

/* CAMERA */

.camera-box{
  text-align:center;
  padding:20px;
  border:2px dashed var(--main2);
  border-radius:20px;
  background:var(--soft);
}

.camera-button{
  border:0;
  background:var(--main);
  color:white;
  padding:14px 22px;
  border-radius:15px;
  font-weight:800;
}

#preview{
  display:none;
  width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:18px;
  margin-top:15px;
}

.camera-text{
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}

/* SETTINGS */

.settings{
  display:none;
}

.color-row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:12px;
}

.color{
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid var(--card);
  outline:1px solid var(--border);
}

.custom-color{
  width:100%;
  height:45px;
  border:1px solid var(--border);
  border-radius:13px;
  margin-top:12px;
  padding:3px;
  background:var(--card);
}

.close-button{
  border:0;
  background:var(--soft);
  color:var(--text);
  padding:10px 16px;
  border-radius:12px;
  margin-top:15px;
}

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:30px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    Calorie <span>✦</span>
  </div>

  <div class="header-buttons">

    <button class="icon-btn" onclick="toggleDark()">
      🌙
    </button>

    <button class="icon-btn" onclick="toggleSettings()">
      ⚙️
    </button>

  </div>

</header>


<div class="container">

<!-- WELCOME -->

<div class="welcome">
  <h1>أهلًا بكِ ✨</h1>
  <p>سجّلي أكلك وتابعي مجموع يومك بسهولة.</p>
</div>


<!-- CALORIES -->

<div class="calorie-card">

  <div class="calorie-title">
    مجموع السعرات اليوم
  </div>

  <div class="calorie-number">
    <span id="total">0</span>
  </div>

  <div class="calorie-sub">
    سعرة حرارية
  </div>

</div>


<!-- QUICK ACTIONS -->

<div class="section-title">
  ماذا تريدين أن تفعلي؟
</div>

<div class="actions">

  <button class="action" onclick="openCamera()">

    <div class="action-icon">📸</div>

    <div class="action-title">
      صوّري أكلك
    </div>

    <div class="action-sub">
      التقطي صورة لوجبتك
    </div>

  </button>


  <button class="action" onclick="scrollToFood()">

    <div class="action-icon">🍽️</div>

    <div class="action-title">
      أضيفي أكلة
    </div>

    <div class="action-sub">
      اختاري من القائمة
    </div>

  </button>

</div>


<!-- CAMERA -->

<div class="section-title">
  📸 تصوير الأكل
</div>

<div class="form-card">

  <div class="camera-box">

    <button class="camera-button" onclick="document.getElementById('cameraInput').click()">
      📷 فتح الكاميرا
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      style="display:none"
      onchange="showPhoto(event)"
    >

    <img id="preview">

    <div id="cameraText" class="camera-text">
      صوّري وجبتك حتى تظهر الصورة هنا
    </div>

  </div>

</div>


<!-- ADD FOOD -->

<div class="section-title" id="foodSection">
  ➕ إضافة أكلة
</div>

<div class="form-card">

  <label>
    اختاري الأكلة
  </label>

  <select id="food">

    <option value="70">🥚 بيضة مسلوقة — 70</option>
    <option value="90">🍳 بيضة مقلية — 90</option>
    <option value="165">🍗 صدر دجاج مشوي 100غ — 165</option>
    <option value="209">🍗 فخذ دجاج 100غ — 209</option>
    <option value="130">🍚 رز مطبوخ 100غ — 130</option>
    <option value="150">🍝 معكرونة مطبوخة 100غ — 150</option>
    <option value="350">🍜 أندومي — 350</option>
    <option value="250">🍟 بطاطا مقلية 100غ — 250</option>
    <option value="52">🍎 تفاحة — 52</option>
    <option value="89">🍌 موزة — 89</option>
    <option value="25">🥒 خيار — 25</option>
    <option value="41">🍅 طماطم — 41</option>
    <option value="120">🥛 لبن 225 مل — 120</option>
    <option value="100">🫓 خبز عربي صغير — 100</option>
    <option value="250">🍔 برغر — 250</option>
    <option value="300">🍕 قطعة بيتزا — 300</option>
    <option value="150">🥣 شوربة دجاج — 150</option>
    <option value="200">🐟 تونة 100غ — 200</option>

  </select>


  <label>
    الكمية
  </label>

  <input
    id="quantity"
    type="number"
    min="1"
    value="1"
  >


  <button class="main-button" onclick="addFood()">
    إضافة إلى يومي ✨
  </button>

</div>


<!-- TODAY -->

<div class="section-title">
  🍽️ أكل اليوم
</div>

<div id="foodList">

  <div class="empty">
    لم تتم إضافة أي أكلات بعد 🌷
  </div>

</div>


<button
  class="main-button"
  onclick="clearAll()"
  style="background:#eee;color:#555;box-shadow:none"
>
  🗑️ مسح أكل اليوم
</button>


<!-- SETTINGS -->

<div class="section-title">
  🎨 تخصيص الواجهة
</div>

<div class="form-card settings" id="settings">

  <strong>
    اختاري لون التطبيق
  </strong>

  <div class="color-row">

    <button class="color" style="background:#8b5cf6" onclick="setColor('#8b5cf6','#c084fc')"></button>

    <button class="color" style="background:#ec4899" onclick="setColor('#ec4899','#f9a8d4')"></button>

    <button class="color" style="background:#06b6d4" onclick="setColor('#06b6d4','#67e8f9')"></button>

    <button class="color" style="background:#10b981" onclick="setColor('#10b981','#6ee7b7')"></button>

    <button class="color" style="background:#f59e0b" onclick="setColor('#f59e0b','#fcd34d')"></button>

    <button class="color" style="background:#ef4444" onclick="setColor('#ef4444','#fca5a5')"></button>

    <button class="color" style="background:#3b82f6" onclick="setColor('#3b82f6','#93c5fd')"></button>

    <button class="color" style="background:#111827" onclick="setColor('#111827','#6b7280')"></button>

  </div>

  <label>
    🎨 اختاري أي لون تريدينه
  </label>

  <input
    class="custom-color"
    type="color"
    value="#8b5cf6"
    onchange="customColor(this.value)"
  >

  <button class="close-button" onclick="toggleSettings()">
    إغلاق
  </button>

</div>


<div class="footer">
  Calorie ✦ — تطبيقك الصغير لحساب السعرات
</div>

</div>


<script>

let foods = [];
let totalCalories = 0;


/* CAMERA */

function openCamera(){

  document
  .getElementById("cameraInput")
  .click();

}


function showPhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const image = document.getElementById("preview");

  const text = document.getElementById("cameraText");

  image.src = URL.createObjectURL(file);

  image.style.display = "block";

  text.textContent = "✅ تم التقاط صورة الأكلة";

}


/* ADD FOOD */

function addFood(){

  const select = document.getElementById("food");

  const quantity =
    Number(document.getElementById("quantity").value);

  if(quantity < 1){

    alert("اكتبي كمية صحيحة");

    return;

  }

  const name =
    select.options[select.selectedIndex].text;

  const calories =
    Number(select.value);

  const total =
    calories * quantity;

  foods.push({

    name:name,

    quantity:quantity,

    calories:total

  });

  totalCalories += total;

  updateScreen();

}


/* UPDATE */

function updateScreen(){

  const list =
    document.getElementById("foodList");

  document.getElementById("total")
    .textContent = totalCalories;


  if(foods.length === 0){

    list.innerHTML =
      '<div class="empty">لم تتم إضافة أي أكلات بعد 🌷</div>';

    return;

  }


  list.innerHTML = "";


  foods.forEach((food,index)=>{

    const item =
      document.createElement("div");

    item.className = "food-card";


    item.innerHTML = `

      <div>

        <div class="food-name">
          ${food.name}
        </div>

        <div class="food-info">
          الكمية: ${food.quantity}
          • ${food.calories} سعرة
        </div>

      </div>

      <button
        class="delete"
        onclick="deleteFood(${index})"
      >
        🗑️
      </button>

    `;


    list.appendChild(item);

  });

}


/* DELETE */

function deleteFood(index){

  totalCalories -= foods[index].calories;

  foods.splice(index,1);

  updateScreen();

}


/* CLEAR */

function clearAll(){

  foods = [];

  totalCalories = 0;

  updateScreen();

}


/* DARK MODE */

function toggleDark(){

  document.body.classList.toggle("dark");

}


/* SETTINGS */

function toggleSettings(){

  const box =
    document.getElementById("settings");

  if(box.style.display === "block"){

    box.style.display = "none";

  }else{

    box.style.display = "block";

  }

}


/* COLORS */

function setColor(main,main2){

  document.documentElement
    .style.setProperty("--main",main);

  document.documentElement
    .style.setProperty("--main2",main2);

}


function customColor(color){

  document.documentElement
    .style.setProperty("--main",color);

  document.documentElement
    .style.setProperty("--main2",color);

}


/* SCROLL */

function scrollToFood(){

  document
    .getElementById("foodSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}

</script>

</body>
</html>
